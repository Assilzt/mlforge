<!doctype html><html lang="en"><meta charset="utf-8"><title>MLForge</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;color:#17324d}button{padding:10px 16px;background:#0b6170;color:white;border:0;border-radius:6px}pre{background:#f3f6f8;padding:14px;overflow:auto}</style><h1>MLForge</h1><p>Transparent tabular ML baseline workbench.</p><form id="f"><input type="file" id="file" accept=".csv,.xlsx" required><input id="target" placeholder="target column" required><button>Train</button></form><pre id="out">Choose a dataset and target.</pre><script>f.onsubmit=async e=>{e.preventDefault();let d=new FormData();d.append('file',file.files[0]);let r=await fetch('/api/train?target='+encodeURIComponent(target.value),{method:'POST',body:d});out.textContent=JSON.stringify(await r.json(),null,2)}</script></html>
