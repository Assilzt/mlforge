[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlforge"
version = "0.1.0"
description = "Transparent, reproducible tabular ML baseline workbench"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mlforge = "mlforge_core.cli:main"

[tool.setuptools.packages.find]
include = ["mlforge_core*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
